name: Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build universal APK and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Point Gradle at the CI Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build universal debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Rename APK to include version
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/FreeTube-${{ steps.version.outputs.VERSION }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "FreeTube ${{ steps.version.outputs.VERSION }}"
          files: app/build/outputs/apk/debug/FreeTube-${{ steps.version.outputs.VERSION }}.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
