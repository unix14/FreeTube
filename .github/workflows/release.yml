name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build universal APK and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Point Gradle at the CI Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build universal APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK to include version
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/FreeTube-${{ steps.version.outputs.VERSION }}.apk

      - name: Create git tag (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Actions"
          git tag ${{ steps.version.outputs.VERSION }}
          git push origin ${{ steps.version.outputs.VERSION }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: "FreeTube ${{ steps.version.outputs.VERSION }}"
          files: app/build/outputs/apk/debug/FreeTube-${{ steps.version.outputs.VERSION }}.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
